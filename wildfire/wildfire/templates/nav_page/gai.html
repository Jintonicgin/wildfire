{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gai.css') }}">
{% endblock %}

{% block title %}Generative AI{% endblock %}

{% block content %}
<div class="gai-wrap">
  <div class="gai-header">
    <h2>Generative AI</h2>
    <div class="gai-controls">
      <select id="modeSelect">
        <option value="chat">일반 대화</option>
        <option value="translate_to_ko">번역 → 한국어</option>
        <option value="translate_to_en">번역 → English</option>
        <option value="summarize">요약</option>
      </select>
      <input id="temperature" type="number" step="0.1" min="0" max="1.5" value="0.7">
      <button id="resetChat" class="btn-secondary">대화 초기화</button>
    </div>
  </div>

  <div class="chat-card">
    <div id="chatWindow" class="chat-window"></div>
    <div class="chat-input">
      <textarea id="userInput" rows="2" placeholder="메시지를 입력하세요. Shift+Enter 줄바꿈"></textarea>
      <button id="sendBtn" class="btn">보내기</button>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='js/gai.js') }}"></script>
{% endblock %}
